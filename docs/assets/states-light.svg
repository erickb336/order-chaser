<text x="304" y="151" fill="#4a5260" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">at the bid, ≤ cap</text>
