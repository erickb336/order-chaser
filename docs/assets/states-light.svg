<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="title desc">
<title id="title">Chase states</title><desc id="desc">The chase states. Placing goes to resting. Resting and amending go back and forth while the bid moves. An amend that Kraken rejects goes to reconcile, which reads the order and goes back to resting. No message for 10 s makes the feed lost; when the feed comes back, reconcile reads the order again. A timeout, Fill the rest now, or Stop goes to cancelling. After a timeout or Fill the rest now: reread the filled quantity, send one IOC at the cap, then done. Stop goes from cancelling to done, and so does a cancel rejected 3 times. A timeout while the feed is lost cancels and sends no IOC. Done has one outcome: filled, not filled, stopped, liquidated or ended.</desc>
<defs><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5260"/></marker><marker id="arrow-order" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f4fd1"/></marker><marker id="arrow-ioc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b3fd1"/></marker><marker id="arrow-ask" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b42318"/></marker><marker id="arrow-cap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a5300"/></marker></defs>
<rect x="0.5" y="0.5" width="959" height="559" rx="14" fill="#ffffff" stroke="#c4cad4"/>
