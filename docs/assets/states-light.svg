<line x1="635.0" y1="162" x2="635.0" y2="260" stroke="#4a5260" stroke-width="1.6" marker-end="url(#arrow-muted)"/>
<text x="643.0" y="211.0" fill="#4a5260" font-size="12" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">amend rejected</text>
