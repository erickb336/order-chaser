<text x="32" y="68" fill="#4a5260" font-size="14" font-weight="400" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">From src/order_chaser/core.py. One step(chase, event) function moves a chase.</text>
