<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Result · Order chaser</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/style.css"></head>
<body>
<main class="app">
  <div class="switcher" id="sw"></div>
  <div id="strip" style="margin-bottom:16px"></div>
  <div class="status" id="card"></div>
  <div class="facts" id="facts" style="margin-top:16px"></div>
  <div class="grid2" style="margin-top:16px">
    <div class="card"><h2>Fills, from Kraken</h2><table class="t" id="fills"></table>
      <p class="tiny muted" style="margin:8px 0 0">Prices, amounts and fees come from Kraken's private feed and were checked against TradesHistory at the end.</p></div>
    <div class="card"><h2>Check it in Kraken Pro</h2><div id="check" class="small"></div></div>
  </div>
  <div class="row" style="margin-top:16px" id="actions"></div>
</main>
<script src="assets/proto.js"></script>
<script>
OC.chrome('result', 'live');
const $ = OC.$;
const ORDER = [['filled', 'Filled (100%)', 'Spot'], ['almost', 'Almost filled (rounds down to 99%)'], ['timer', 'Ended by the safety timer'], ['stopped', 'Stopped by you'], ['m-open', 'Margin open: part filled', 'Margin']];
const F1 = ['09:52:31', '0.0180', '62,412.00', 'maker', '2.81'];
const S = {
  filled: { st: ['Filled', 'fill'], head: 'Bought 0.0500 BTC at an average of 62,413.86', q: '0.0500', pct: 100, fills: [F1, ['09:53:12', '0.0320', '62,414.90', 'maker', '4.99']], fee: '7.80', save: '0.23', note: 'All fills were maker fills at 0.25%.' },
  almost: { st: ['Part filled', 'warn'], head: 'Bought 0.04999 BTC of 0.0500 BTC', q: '0.04999', pct: 99, fills: [F1, ['09:54:04', '0.03199', '62,418.50', 'taker (IOC)', '7.99']], fee: '10.80', save: '0.11', note: 'The IOC got 0.03199 of 0.0320 BTC. The page shows 99%: the percent rounds down and shows 100% only when all of the amount filled.', rest: '0.00001 BTC is below the Kraken minimum (0.0001 BTC). You cannot chase it.' },
  timer: { st: ['Ended by the safety timer', 'bad'], head: 'Bought 0.0180 of 0.0500 BTC', q: '0.0180', pct: 36, fills: [F1], fee: '2.81', save: '0.12', note: 'The tool lost the connection for more than 60 s at 09:52:46. Kraken cancelled all your orders at 09:53:44. No IOC was sent.', warn: 'Kraken also cancelled 3 of your other open orders: 1 stop-loss and 1 take-profit on ETH/USD, and 1 limit on SOL/USD (sample). Place them again in Kraken Pro. <a href="chase.html#fired">See the list</a>.' },
  stopped: { st: ['Stopped by you', 'muted'], head: 'Bought 0.0180 of 0.0500 BTC', q: '0.0180', pct: 36, fills: [F1], fee: '2.81', save: '0.12', note: 'You clicked Stop at 09:52:58. Kraken confirmed the cancel at 09:52:58.' },
  'm-open': { mg: true, st: ['Part filled · position open', 'warn'], head: 'Opened 0.0180 BTC long at 3x, of 0.0500 BTC', q: '0.0180', pct: 36, fills: [F1], fee: '2.81 + 0.56 opening', save: '0.12', note: 'The safety timer cancelled the order. The position stays open on Kraken.', warn: 'Position open: 0.0180 BTC long, 3x, entry 62,412.00. Margin level 1,890% (sample). Kraken liquidates at 40%. Rollover starts at 13:00 + 4 h.' },
};
function draw(id) {
  const s = S[id];
  $('strip').innerHTML = '<div class="livestrip">LIVE: these were real orders on your Kraken account.</div>' + (s.mg ? '<div class="mgstrip" style="margin-top:6px">MARGIN: this chase opened a 3x long position. It stays open until you close it.</div>' : '');
  $('card').innerHTML = `<div class="state tone-${s.st[1]}"><i></i>${s.st[0]}</div><div class="head">${s.head}</div><p class="sub">${s.note}</p>` +
    (s.warn ? `<div class="note warn small" style="margin-top:10px">${s.warn}</div>` : '') + (s.rest ? `<p class="small muted" style="margin:8px 0 0">${s.rest}</p>` : '') +
    `<div class="row small" style="margin-top:10px"><span>Filled <b class="num">${s.q}</b> of 0.0500 BTC</span><span class="spacer"></span><b class="num">${s.pct}%</b></div><div class="bar" style="margin-top:6px"><i class="m" style="width:${s.pct}%"></i></div>`;
  $('facts').innerHTML = [['Filled', s.pct + '%', s.q + ' BTC'], ['Fees, charged by Kraken', s.fee, 'USD'], ['Saved vs a market order at start', s.save, 'USD, for the part that filled'], ['Duration', id === 'filled' ? '1:08' : id === 'stopped' ? '0:54' : '2:00', 'min:s']].map(([k, v, t]) => `<div><div class="k">${k}</div><div class="v">${v}</div><div class="s">${t}</div></div>`).join('');
  $('fills').innerHTML = '<tr><th>Time</th><th class="r">BTC</th><th class="r">Price</th><th>Kind</th><th class="r">Fee USD</th></tr>' + s.fills.map(f => `<tr><td class="num">${f[0]}</td><td class="r num">${f[1]}</td><td class="r num">${f[2]}</td><td>${f[3]}</td><td class="r num">${f[4]}</td></tr>`).join('');
  $('check').innerHTML = `<p style="margin:0 0 8px">In Kraken Pro, open <b>Orders</b>, then <b>Trades</b>. Look for these (sample ids):</p><table class="kv"><tr><td class="muted">Chase order</td><td class="mono">OQX3T4-ABCDE-FGHIJK</td></tr>${id === 'almost' ? '<tr><td class="muted">IOC order</td><td class="mono">O7KL2P-LMNOP-QRSTUV</td></tr>' : ''}<tr><td class="muted">Our id (cl_ord_id)</td><td class="mono">oc-0412-1</td></tr><tr><td class="muted">Started</td><td class="num">4 Oct 2026, 09:52:04</td></tr></table>`;
  $('actions').innerHTML = s.mg ? '<a class="btn primary" href="new.html#m-close">Close this position</a><a class="btn" href="new.html#live">New chase</a>' : id === 'filled' || id === 'almost' ? '<a class="btn primary" href="new.html#live">New chase</a>' : '<a class="btn primary" href="new.html#live">Chase the rest (0.0320 BTC), new cap</a><a class="btn" href="new.html#live">New chase</a>';
}
OC.switcher($('sw'), 'result state', ORDER, draw, 'filled');
</script>
</body></html>
