[project]
name = "order-chaser"
version = "0.1.0"
description = "Kraken order chaser: chases a post-only limit order. This version runs dry runs only."
requires-python = "==3.12.*"
dependencies = [
    "httpx==0.28.1",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
    "websockets==17.2",
]

[project.scripts]
order-chaser = "order_chaser.server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
